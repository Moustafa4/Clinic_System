@if (loadingService.isloading()) {
  <div class="loader-overlay">
    <div class="loader-content">
      <div class="logo-wrapper">
        <div class="loader-spinner"></div>
        <div class="logo_part">
          <div class="back_part">
            <div class="part1"><img src="/img/loader/logo-part-3-left.png" alt="" /></div>
            <div class="part2"><img src="/img/loader/logo-part-4-right.png" alt="" /></div>
          </div>
          <div class="front_part">
            <div class="part1"><img src="/img/loader/logo-part-1-top.png" alt="" /></div>
            <div class="part2"><img src="/img/loader/logo-part-2-bottom.png" alt="" /></div>
          </div>
        </div>
        <!-- <img src="assets/images/logo.png" alt="Loading" class="loader-logo" /> -->
      </div>

      <p class="loading-text">Please wait...</p>
    </div>
  </div>
}
