<div class="container-fluid dashboard-section">
  <div class="row g-3 dashboard-row">
    <!-- Quick Actions -->
    <div class="col-12 col-lg-6">
      <div class="card h-100">
        <div class="card-header">
          <div class="card-title">
            <div class="icon">
              <!-- نفس SVG الموجود عندك -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1a7fcb"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            </div>
            إجراءات سريعة
          </div>
        </div>

        <div class="quick-actions-grid">
          <!-- Add Doctor -->
          <a class="action-btn" href="#">
            <div class="action-icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2zm0 12c-5.33 0-8 2.67-8 4v1h16v-1c0-1.33-2.67-4-8-4z"
                />
                <path
                  d="M17 9h2m-1-1v2"
                  stroke="white"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  fill="none"
                />
              </svg>
            </div>

            <div class="action-label">إضافة طبيب</div>

            <div class="action-sub">
              <i class="pi pi-angle-left"></i>
              تسجيل طبيب جديد
            </div>
          </a>

          <!-- Add Clinic -->
          <a class="action-btn" href="#">
            <div class="action-icon">
              <svg viewBox="0 0 24 24">
                <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" />
                <path
                  d="M12 7v4m-2-2h4"
                  stroke="white"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  fill="none"
                />
              </svg>
            </div>

            <div class="action-label">إضافة عيادة</div>

            <div class="action-sub">
              <i class="pi pi-angle-left"></i>
              إضافة عيادة جديدة
            </div>
          </a>

          <!-- Add Receptionist -->
          <a class="action-btn purple" href="#">
            <div class="action-icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                />
              </svg>
            </div>

            <div class="action-label">إضافة موظف استقبال</div>

            <div class="action-sub">
              <i class="pi pi-angle-left"></i>
              تسجيل موظف استقبال
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Recent Activities -->
    <div class="col-12 col-lg-6">
      <div class="card h-100">
        <div class="card-header">
          <a href="#" class="view-all">
            <i class="pi pi-angle-left"></i>
            عرض الكل
          </a>

          <div class="card-title">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1a7fcb"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
              </svg>
            </div>
            آخر الأنشطة
          </div>
        </div>

        <div class="activity-list">
          <div class="activity-item">
            <div class="activity-text-block">
              <div class="activity-text">تم إضافة دكتور جديد: د. محمد علي</div>
              <div class="activity-time">منذ 10 دقائق</div>
            </div>

            <div class="activity-icon-wrap blue">
              <i class="pi pi-user"></i>
            </div>
          </div>

          <div class="activity-item">
            <div class="activity-text-block">
              <div class="activity-text">تم حجز موعد جديد للمريض: أحمد محمود</div>
              <div class="activity-time">منذ 30 دقيقة</div>
            </div>

            <div class="activity-icon-wrap green">
              <i class="pi pi-calendar"></i>
            </div>
          </div>

          <div class="activity-item">
            <div class="activity-text-block">
              <div class="activity-text">تم إنشاء عيادة جديدة: عيادة الأسنان</div>
              <div class="activity-time">منذ ساعة</div>
            </div>

            <div class="activity-icon-wrap orange">
              <i class="pi pi-home"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
